# Free 24/7 publisher — no Cursor model, no paid host.
# Repo secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID
name: publish-news

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore dedupe state
        uses: actions/cache@v4
        with:
          path: data
          key: posted-kv-v1
          restore-keys: |
            posted-kv-

      - name: Publish one news item
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: npm run publish:once
